{% extends 'base_panel.html' %}

{% block title %}Registrar gasto | GymManager Pro{% endblock %}
{% block page_title %}Finanzas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-7 col-xl-5">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-danger"><i class="fas fa-minus-circle mr-1"></i> Registrar nuevo gasto</h6>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'partials/campos_form.html' %}
                    <button type="submit" class="btn btn-danger"><i class="fas fa-save mr-1"></i> Guardar gasto</button>
                    <a href="{% url 'finanzas:inicio' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
