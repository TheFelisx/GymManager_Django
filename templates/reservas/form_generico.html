{% extends 'base_panel.html' %}

{% block title %}{{ titulo }} | GymManager Pro{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-6">
        <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">{{ titulo }}</h6></div>
            <div class="card-body">
                {% if texto %}<p class="text-muted small">{{ texto }}</p>{% endif %}
                <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>
                    {% csrf_token %}
                    {% include 'partials/campos_form.html' %}
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> Guardar</button>
                    <a href="{% url volver %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
