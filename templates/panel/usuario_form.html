{% extends 'base_panel.html' %}

{% block title %}{{ titulo }} | GymManager Pro{% endblock %}
{% block page_title %}Personal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-7 col-xl-5">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-user-shield mr-1"></i> {{ titulo }}</h6>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'partials/campos_form.html' %}
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> {% if edicion %}Guardar cambios{% else %}Crear cuenta{% endif %}</button>
                    <a href="{% url 'panel:lista_usuarios' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
