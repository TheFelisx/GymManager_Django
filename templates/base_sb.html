{% load static %}<!DOCTYPE html>
<html lang="es-cl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}GymManager Pro{% endblock %}</title>
    <script>
        /* Modo claro/oscuro: se aplica antes de pintar para evitar el parpadeo */
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('gym-theme') || 'light'); } catch (e) {}
    </script>

    <!-- Fuentes e íconos (SB Admin 2) -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">

    <!-- SB Admin 2 + ajustes de marca GymManager -->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/gym-panel.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}" id="page-top">

    {% block body %}{% endblock %}

    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
